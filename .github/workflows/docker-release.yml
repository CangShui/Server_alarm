name: Build and Push Docker Image on Release

on:
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  # 固定镜像名，不跟随仓库名自动推导：仓库名大小写/改名都不会让镜像地址漂移
  IMAGE_NAME: cangshui/server_alarm

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.event.release.prerelease == false }}

      - name: 诊断 - GITHUB_TOKEN 在 ghcr 的授权范围
        run: |
          set +e
          RESP=$(curl -sS -u "x-access-token:${{ secrets.GITHUB_TOKEN }}" \
            "https://ghcr.io/token?service=ghcr.io&scope=repository:cangshui/server_alarm:push,pull")
          echo "RAW: $RESP"
          JWT=$(echo "$RESP" | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')
          if [ -z "$JWT" ]; then
            echo "::error::DIAG 用 GITHUB_TOKEN 换取 ghcr token 失败: $(echo "$RESP" | head -c 200)"
            exit 0
          fi
          P=$(echo "$JWT" | cut -d. -f2)
          case $(( (4 - ${#P} % 4) % 4 )) in
            1) P="$P=" ;;
            2) P="$P==" ;;
            3) P="$P===" ;;
          esac
          echo "$P" | tr '_-' '/+' | base64 -d > /tmp/claims.json
          echo "::error::DIAG claims=$(cat /tmp/claims.json)"
          if grep -q '"push"' /tmp/claims.json; then
            echo "::error::DIAG 结论=token 已拿到 push 权限，失败原因在包级访问控制（包已存在且未授权给本仓库）"
          else
            echo "::error::DIAG 结论=token 未拿到 push 权限，失败原因在仓库/账户的 Workflow permissions 设置"
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
